<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Quarto Exercício</title>
    <style>
        body{
            background-color: green;
            color: rgb(63, 2, 63);
            font: normal 25pt Arial;
        }
        h1{
            color: rgb(255, 255, 255);
            text-shadow: 2px 2px 2px rgb(0, 0, 0);
        }
    </style>
</head>
<body>
    <h1>Quarto Exercício</h1>
    <script>
        var nome = window.prompt('Qual é o seu nome?');
        document.write(`Seu nome tem ${nome.length} letras.`);
        document.write(`Seu nome em maiúsculas é ${nome.toUpperCase()}.`);
        document.write(`Seu nome em minúsculas é ${nome.toLowerCase()}.`);
    </script>
</body>
</html>
